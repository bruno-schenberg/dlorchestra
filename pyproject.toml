[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dlorchestra"
version = "0.1.0"
description = "DL experiment orchestration: config-driven runner, k-fold CV, metrics/plotting, AMP training, cross-model analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Bruno Schenberg" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1",
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
]

[project.urls]
Homepage = "https://github.com/bruno-schenberg/dlorchestra"
Repository = "https://github.com/bruno-schenberg/dlorchestra"
Issues = "https://github.com/bruno-schenberg/dlorchestra/issues"

[project.optional-dependencies]
# set_seed() also seeds MONAI's RNG registry when monai is importable — not
# a hard dependency, the rest of the library has no MONAI coupling.
monai = ["monai>=1.3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["dlorchestra*"]

[tool.setuptools.package-data]
dlorchestra = ["py.typed"]
